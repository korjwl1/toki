[package]
name = "toki"
version = "2.2.0"
edition = "2021"
description = "AI CLI tool token usage tracker module"
license = "FSL-1.1-Apache-2.0"
repository = "https://github.com/korjwl1/toki"
homepage = "https://github.com/korjwl1/toki"

[lib]
name = "toki"
path = "src/lib.rs"

[[bin]]
name = "toki"
path = "src/main.rs"

[dependencies]
notify = "6"
fjall = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
bincode = "1"
crossbeam-channel = "0.5"
dirs = "6"
glob = "0.3"
rayon = "1.10"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
comfy-table = "7"
ureq = { version = "2", features = ["json", "native-tls"] }
keyring = "2"
cursive = { version = "0.21", default-features = false, features = ["crossterm-backend"] }
memmap2 = "0.9.10"
memchr = "2.8.0"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"
zstd = "0.13"
native-tls = "0.2"
toki-sync-protocol = { git = "https://github.com/korjwl1/toki-sync-protocol.git", tag = "v1.0.0" }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0.6"

[dev-dependencies]
tempfile = "3"

# Local override for feature-branch development of the protocol crate.
#
# It is load-bearing right now, not a convenience: this branch uses
# SyncWindows (0x24) and WireWindow, which exist only after v1.0.0. Dropping
# the patch before the next tag exists will not compile.
#
# Release process, in this order:
#   1. tag toki-sync-protocol v1.1.0 (its Cargo version already says 1.1.0)
#   2. re-pin `tag = "v1.1.0"` above, here and in the other repo
#   3. drop this patch section
#   4. release the daemon before the monitor — the monitor reads windows the
#      daemon has to be emitting first
[patch."https://github.com/korjwl1/toki-sync-protocol.git"]
toki-sync-protocol = { path = "../toki_sync_protocol" }
